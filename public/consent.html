<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7a0019">
  <meta name="description" content="Agree to the AnonIsko terms before continuing.">
  <title>AnonIsko | Terms Agreement</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/styles.css?v=310">
</head>
<body class="consent-page">
  <main class="consent-main">
    <section class="consent-hero">
      <div class="consent-logo-stage" aria-hidden="true">
        <span class="consent-logo-ring"></span>
        <img src="/assets/favicon.svg" alt="" class="consent-logo-image">
      </div>

      <div class="consent-copy-block">
        <p class="kicker">before you continue</p>
        <h1>Use AnonIsko respectfully.</h1>
        <p class="consent-copy">
          AnonIsko is built for anonymous student conversations. Please respect other users,
          avoid sharing sensitive personal information, and use the platform responsibly.
        </p>
      </div>
    </section>

    <section class="consent-agreement" aria-labelledby="consentHeading">
      <div class="consent-rule"></div>

      <label class="consent-check" for="agreeCheckbox">
        <input id="agreeCheckbox" type="checkbox">
        <span class="consent-check-box" aria-hidden="true"></span>
        <span>
          I have read and agree to the
          <a href="/terms" target="_blank" rel="noopener">AnonIsko Terms</a>.
        </span>
      </label>

      <div class="consent-actions">
        <a class="secondary-button consent-read" href="/terms">Read Terms</a>
        <button id="agreeButton" class="primary-button consent-agree" type="button" disabled>I agree</button>
      </div>

      <p class="consent-note">
        You only need to agree once on this browser.
      </p>
    </section>
  </main>

  <script src="/theme.js?v=310"></script>
  <script src="/consent.js?v=310"></script>
</body>
</html>
